<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" aria-hidden="true">
  <!-- Three bite marks at the foot of the hero. Lobe tops step down
       (y=0, 60, 210) so they read as three distinct bites rather than one
       cloud; every lobe runs past the bottom edge, and the bar at y=300
       closes the gaps between them. -->
  <g fill="#FCF3E7">
    <rect x="-10" y="300" width="660" height="60"/>
    <circle cx="20"  cy="175" r="175"/>
    <circle cx="290" cy="245" r="185"/>
    <circle cx="530" cy="330" r="120"/>
  </g>
</svg>
